server:
  port: 8080
  servlet:
    contextPath: /

spring:
  # 数据库配置
  datasource:
    url: 'jdbc:mysql://localhost:3306/mail_batch?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true'
    username: root
    password: root123
    driverClassName: com.mysql.cj.jdbc.Driver
    hikari:
      maximumPoolSize: 10
      minimumIdle: 5
      connectionTimeout: 30000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Mail配置
  mail:
    host: smtp.qq.com
    port: 587
    username: 492203171@qq.com
    password: '***'
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT配置
jwt:
  secret: your-very-secure-secret-key-should-be-at-least-256-bits-long
  expiration: 86400000

# 日志配置
logging:
  level:
    root: DEBUG
    com.mailbatch.mailbatchsystem: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} --- [%t] %msg%n"
